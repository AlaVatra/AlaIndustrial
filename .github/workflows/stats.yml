# Collect download statistics for the guide site once a day.
#
# Neither Modrinth nor CurseForge exposes a public day-by-day history, so the
# history is this file: one cumulative snapshot per day in data/stats.json, which
# the site turns into the chart on its front page.
#
# data/stats.json is the only output. The guide site is hosted elsewhere and
# reads the file from this repository.
name: Stats

on:
  schedule:
    # 00:37 UTC — just after midnight, so the counters read here are what the day
    # that just ended closed with; fetch-stats.py dates the row with YESTERDAY.
    # It used to run at 04:17 and date the row with the current day, which put
    # yesterday's downloads under today's label on the chart.
    # :37 and not :00 — scheduled runs queue globally and drift the most at the
    # top of the hour. Drift here is harmless: it moves away from midnight, so
    # the row still lands on the same day either way.
    - cron: '37 0 * * *'
    # Catch-up. GitHub drops scheduled runs when it is busy, and on 2026-08-27 it
    # dropped BOTH this workflow and the watchdog that is meant to notice — the
    # site then served day-old figures until a human spotted them. A second slot,
    # six hours away from the first, is the cheapest independent attempt: when
    # yesterday is already recorded in full the script exits before its first HTTP
    # request, so a healthy morning costs one runner start and no commit.
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: write      # commit the snapshot

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub's default is six hours, and a job that hangs on a marketplace API call does not fail
    # on its own — six hours bill as 360 minutes, 18 % of the monthly allowance, for one stuck run.
    # This job was the last one in the repository without a limit (MOD-564); the collector itself
    # finishes in well under half a minute.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test the collector
        # A second of mocked runs before the real one. The rules it checks are the
        # ones that quietly broke the chart on 2026-08-27 and were invisible on any
        # green day: a stub row for the current day, a catch-up run overwriting a
        # good one, a midday run pulling today's downloads into yesterday. Failing
        # here stops the snapshot on purpose — writing a wrong row is worse than
        # writing none, and the watchdog reports a missing row six hours later.
        run: python .github/scripts/test-stats.py

      - name: Collect snapshot
        env:
          # Optional. Without it the script falls back to the keyless cfwidget
          # mirror; the plain Modrinth totals need no key at all.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Used only to recover the days that predate the first snapshot, via the
          # Modrinth analytics endpoint. Without it the series simply starts
          # with yesterday.
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          # Which slot woke us up. Passed through env and never interpolated into
          # the script body: a ${{ }} inside `run:` becomes source code before bash
          # ever sees it.
          CATCH_UP_SLOT: ${{ github.event.schedule == '43 6 * * *' }}
        run: |
          # The catch-up slot must not collect when the night run already did:
          # reading the counters now would pour hours of TODAY into yesterday's row.
          # A manual dispatch never skips — that is the button for fixing data.
          if [ "$CATCH_UP_SLOT" = "true" ]; then
            python .github/scripts/fetch-stats.py --out data/stats.json --skip-if-current
          else
            python .github/scripts/fetch-stats.py --out data/stats.json
          fi

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ holds only what this workflow writes: stats.json and, since MOD-749,
          # curseforge-files.json (per-file counters, kept for a month).
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change — nothing to commit"
          else
            git commit -m "chore(stats): daily download snapshot [skip ci]"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
