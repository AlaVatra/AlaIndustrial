# Publish the guide site (site/) to its own server over rsync, then check the live address.
# Runs next to pages-deploy.yml: both fire on the same push while the move is in progress, so either
# address can be the live one. Remove this file's twin (pages-deploy.yml) only after the new host has run
# without incident for a week.
#
# Repository settings this needs:
#   secret    WIKI_DEPLOY_KEY      private half of the upload key (the server accepts only rsync into the
#                                  site directory with it)
#   secret    WIKI_KNOWN_HOSTS     the server's host key line(s), from `ssh-keyscan -t ed25519 <host>`
#   secret    WIKI_HOST            address of the server (an IP address); also used by the smoke test
#                                  to prove the origin cannot be reached around the CDN
#   variable  WIKI_SSH_USER        upload account name on the server
#   variable  WIKI_BASE_URL        address the smoke test checks, e.g. https://wiki.alaindustrial.org
#                                  (during the move: the staging name)
#   optional  secret WIKI_CF_PURGE_TOKEN + variable WIKI_CF_ZONE_ID: purge the CDN cache after a deploy
name: Deploy Guide Site (own server)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - '.github/workflows/deploy-wiki.yml'
      - '.github/scripts/wiki-smoke.sh'
  workflow_dispatch:
    inputs:
      max_delete:
        description: 'Largest number of files one run may delete on the server'
        required: false
        default: '2000'
      skip_smoke:
        description: 'Skip the live checks (only for a run against a host that is not public yet)'
        required: false
        default: 'false'

permissions:
  contents: read

# One upload at a time; a newer push waits instead of cutting a running rsync in half.
concurrency:
  group: wiki-deploy
  cancel-in-progress: false

env:
  # A site with fewer pages or files than this is a broken build, not a small site. The real one has
  # about 1,460 pages and 2,100 images.
  MIN_HTML: '1000'
  MIN_ASSETS: '1000'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIKI_SSH_USER: ${{ vars.WIKI_SSH_USER }}
      WIKI_HOST: ${{ secrets.WIKI_HOST }}
      WIKI_BASE_URL: ${{ vars.WIKI_BASE_URL }}
      PURGE_TOKEN: ${{ secrets.WIKI_CF_PURGE_TOKEN }}
      PURGE_ZONE: ${{ vars.WIKI_CF_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same content as the Pages artifact: the site plus the daily statistics file. It is added to a
      # staging copy, never committed into site/.
      - name: Stage the site
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          rm -rf "$out"
          mkdir -p "$out"
          cp -R site/. "$out/"
          if [ -f data/stats.json ]; then
            mkdir -p "$out/data"
            cp data/stats.json "$out/data/stats.json"
            echo "stats.json added ($(wc -c < data/stats.json) bytes)"
          else
            echo "no data/stats.json yet; the site hides the block on its own"
          fi
          echo "OUT=$out" >> "$GITHUB_ENV"

      # The upload runs with --delete, so an empty or half-built directory would erase the live site.
      - name: Refuse an implausible build
        run: |
          set -euo pipefail
          html=$(find "$OUT" -name '*.html' | wc -l)
          assets=$(find "$OUT/assets" -type f 2>/dev/null | wc -l)
          echo "pages: $html, asset files: $assets"
          test "$html" -ge "$MIN_HTML" || { echo "fewer than $MIN_HTML pages; refusing to upload" >&2; exit 1; }
          test "$assets" -ge "$MIN_ASSETS" || { echo "fewer than $MIN_ASSETS asset files; refusing to upload" >&2; exit 1; }
          for f in index.html 404.html robots.txt sitemap.xml en/index.html assets/guide-site.css assets/guide-site.js; do
            test -s "$OUT/$f" || { echo "missing $f; refusing to upload" >&2; exit 1; }
          done
          if find "$OUT" -name '.git*' | grep -q .; then echo "repository metadata inside the site; refusing" >&2; exit 1; fi

      - name: Prepare the connection
        run: |
          set -euo pipefail
          test -n "$WIKI_SSH_USER" && test -n "$WIKI_HOST" || { echo "WIKI_SSH_USER / WIKI_HOST are not set" >&2; exit 1; }
          test -n "$WIKI_KEY" && test -n "$WIKI_KNOWN_HOSTS" || { echo "WIKI_DEPLOY_KEY / WIKI_KNOWN_HOSTS are not set" >&2; exit 1; }
          s="$RUNNER_TEMP/ssh"
          install -d -m 700 "$s"
          printf '%s\n' "$WIKI_KEY" > "$s/id"
          chmod 600 "$s/id"
          printf '%s\n' "$WIKI_KNOWN_HOSTS" > "$s/known_hosts"
          echo "SSH_DIR=$s" >> "$GITHUB_ENV"
        env:
          WIKI_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
          WIKI_KNOWN_HOSTS: ${{ secrets.WIKI_KNOWN_HOSTS }}

      # -c compares content (a fresh checkout gives every file a new modification time, so a time-based
      # comparison would send all 120 MB every run). --delay-updates stages the new files and renames them
      # into place at the end, so a visitor never sees a half-updated tree; --delete-delay removes the
      # old files only after that. The server side is restricted to this one directory by the key.
      - name: Upload
        run: |
          set -euo pipefail
          MAX="${MAX_DELETE:-2000}"
          case "$MAX" in (*[!0-9]*|'') echo "max_delete must be a number" >&2; exit 1;; esac
          rsync -rc --chmod=D755,F644 --omit-dir-times --delay-updates --delete-delay \
            --max-delete="$MAX" --stats \
            -e "ssh -i $SSH_DIR/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20" \
            "$OUT/" "$WIKI_SSH_USER@$WIKI_HOST:./"
        env:
          MAX_DELETE: ${{ github.event.inputs.max_delete }}

      - name: Purge the CDN cache
        if: env.PURGE_TOKEN != '' && env.PURGE_ZONE != ''
        run: |
          set -euo pipefail
          curl -fsS -m 30 -X POST "https://api.cloudflare.com/client/v4/zones/$PURGE_ZONE/purge_cache" \
            -H "Authorization: Bearer $PURGE_TOKEN" -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}' -o /dev/null
          echo "cache purged"

      - name: Live checks
        if: github.event.inputs.skip_smoke != 'true'
        run: |
          set -euo pipefail
          base="${WIKI_BASE_URL:-https://wiki.alaindustrial.org}"
          # The CDN may serve the previous HTML for a few seconds; one retry covers it.
          ORIGIN_IP="$WIKI_HOST" bash .github/scripts/wiki-smoke.sh "$base" \
            || { sleep 20; ORIGIN_IP="$WIKI_HOST" bash .github/scripts/wiki-smoke.sh "$base"; }

      - name: Remove the key
        if: always()
        run: rm -rf "${SSH_DIR:-$RUNNER_TEMP/ssh}"
