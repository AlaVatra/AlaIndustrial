# Installed into the PUBLIC repo at: .github/workflows/release.yml
# Triggered by pushing a release tag `vX.Y.Z-mc26.3` or `vX.Y.Z-mc26.2` (the axis-free
# `vX.Y.Z` form remains valid only for the historical 26.2 releases). Builds every loader of the line,
# publishes one file per loader to CurseForge and one version per loader to Modrinth with a MARKDOWN
# changelog, and creates one GitHub Release carrying every jar:
#   * a tree that carries the Forge module (forge/build.gradle and forge/src): Fabric + NeoForge + Forge, six
#     marketplace publications, on either Minecraft line;
#   * a tree without it: Fabric + NeoForge, four. Half a module (one of the two without the other) is refused,
#     and so is a Forge jar the tree does not account for.
#
# Why a direct API curl (not mc-publish/itsmeow) for CurseForge: mc-publish does
# NOT send CurseForge's `changelogType`, so the Markdown never renders; itsmeow's
# output→input hop collapses newlines. We POST to the upload API with
# `jq --rawfile` (preserves newlines) + changelogType=markdown. mc-publish is kept
# only for the GitHub Release. Each file's displayName carries its loader in
# brackets, e.g. "... v0.1.5 [Fabric]" / "... v0.1.5 [NeoForge]" / "... [Forge]".
# Modrinth uses separate version numbers per loader (`X.Y.Z+fabric`, `X.Y.Z+neoforge`,
# `X.Y.Z+forge`) so Fabric API remains a Fabric-only required dependency.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual escape hatch. On 2026-08-06 a GitHub incident delayed webhook delivery:
  # tag v0.1.74 sat on the remote but its push event never arrived, so the release
  # could not be started at all — the only trigger was the one thing that was broken.
  # Dispatching with the TAG as the ref bypasses webhook delivery and reproduces a
  # tag run exactly:
  #   gh workflow run release.yml -R AlaVatra/AlaIndustrial --ref vX.Y.Z
  # (UI: Run workflow -> "Use workflow from" -> Tags tab -> vX.Y.Z).
  # GitHub resolves the workflow FILE from the dispatched ref, so a tag offers that
  # Tags entry only if its own tree already carries this trigger — i.e. every tag cut
  # after this change, which is exactly the recovery case. Older tags use the input.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Optional. Leave EMPTY when the ref selected above is already the tag — that is
          the normal path. Fill it in only to publish a tag whose own copy of this file
          predates the workflow_dispatch trigger; then leave the ref on main and this
          value decides what is checked out and published.
        required: false
        type: string
        default: ''
      publish_forge:
        description: >-
          Publish the Forge jar to Modrinth and CurseForge (a tree with forge/ only). Untick it for a run whose
          Forge file is uploaded by hand: the jar is still built, checked and attached to the GitHub Release,
          and publish-ids.json marks it as uploaded by hand. A tag push has no inputs; there the repository
          variable PUBLISH_FORGE=false does the same. Either one set to false turns Forge off.
        required: false
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the GitHub Release
  actions: read     # MOD-678: find and download the jars of the green pre-tag Tests run

# A delayed tag-push event can be delivered AFTER a manual recovery run has started —
# that is precisely the incident shape above. Two CONCURRENT runs would both pass the
# "target does not exist yet" pre-checks and both upload. Serializing per tag (rather
# than cancelling) makes the second run start only once the first has finished, so its
# pre-checks query state that already includes the first run's uploads.
#
# What this does and does not buy, precisely — do not read it as "no duplicates ever":
#   * Modrinth: safe. The pre-check queries the official API for an exact version_number.
#   * GitHub Release: safe. mc-publish updates an existing release, replacing assets by name.
#   * CurseForge: BEST EFFORT ONLY. Its pre-check reads the third-party cfwidget index,
#     which lags from minutes to hours, so a serialized second run can still miss a file
#     the first one just uploaded and publish a duplicate. Serialization narrows the
#     window; it does not close it. Closing it needs the Core API with an x-api-key.
#   * Discord announcement: not sent from here (announce.yml, once per version).
concurrency:
  # Prefixed with the workflow name: concurrency groups are repository-global, so an
  # unprefixed "release-vX.Y.Z" could collide with another workflow's group.
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Standard release mode: every loader of the line. Keep this explicit so accidental one-loader
  # releases cannot happen by editing individual upload steps. Emergency single-loader repairs should
  # use a separate, deliberate workflow. The one switch is Forge's (the publish_forge input or the
  # PUBLISH_FORGE repository variable): its file can be uploaded by hand while the others go from here.
  PUBLISH_LOADERS: all

jobs:
  release:
    runs-on: ubuntu-latest
    # Forge adds a third build and a third game-test lane on a tree with forge/ (about 7 more minutes when the
    # jars are not reused from the pre-tag check).
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      # Single source of truth for tag and version, identical for both triggers.
      # Deliberately BEFORE checkout: it needs no files, so a wrong ref costs seconds
      # rather than a full Build plus both gametest lanes (~6 CI minutes).
      # `github.event.inputs` is used rather than the `inputs` context because the
      # latter does not exist on a push event. The value travels through env, never
      # straight into the shell, so a crafted tag string cannot inject commands.
      - name: Resolve release tag
        id: rel
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          # Anchored regex, NOT a `case` glob: in a glob `*` matches any character, so a
          # pattern like v[0-9]*.[0-9]*.[0-9]* happily accepts `v1.2.3; rm -rf /`. The tag
          # flows into later steps, so it must be pinned to exactly vMAJOR.MINOR.PATCH.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-mc26\.[23])?$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected vX.Y.Z or vX.Y.Z-mc26.2 / vX.Y.Z-mc26.3). Select the tag under 'Use workflow from' -> Tags, or fill in the 'tag' input."
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          VALUE="${TAG#v}"
          echo "version=${VALUE%%-mc*}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (event: $GITHUB_EVENT_NAME, ref: $GITHUB_REF)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the tag. On a tag push this is what checkout picks anyway; on a manual
          # run started from a branch it is the difference between publishing the tagged
          # tree and publishing whatever HEAD happens to be.
          ref: ${{ steps.rel.outputs.tag }}

      - name: Resolve game and release identity
        id: game
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          RELEASE_VERSION: ${{ steps.rel.outputs.version }}
        run: |
          MC=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          VERSION=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          NF=$(sed -n 's/^neoforge_version=//p' gradle.properties | tr -d '\r')
          FG=$(sed -n 's/^forge_version=//p' gradle.properties | tr -d '\r')
          [[ "$MC" == 26.2 || "$MC" == 26.3 ]] || { echo "::error::unsupported Minecraft $MC"; exit 1; }
          [[ "$VERSION" == "$RELEASE_VERSION" ]] || { echo "::error::tag and project version differ"; exit 1; }
          [[ "$RELEASE_TAG" == "v$VERSION-mc$MC" || ( "$MC" == 26.2 && "$RELEASE_TAG" == "v$VERSION" ) ]] || { echo "::error::tag and Minecraft version differ"; exit 1; }
          echo "minecraft=$MC" >> "$GITHUB_OUTPUT"
          echo "identity=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          TYPE=release
          [[ "$NF" != *-beta* ]] || TYPE=beta
          echo "neoforge_type=$TYPE" >> "$GITHUB_OUTPUT"
          # Forge: the tree decides, on either line. The module is forge/build.gradle plus forge/src plus a
          # forge_version; one without the others is a broken sync, not a loader set.
          FORGE=false
          if [[ -f forge/build.gradle && -d forge/src ]]; then
            FORGE=true
            [[ -n "$FG" ]] || { echo "::error::the tree carries forge/, but gradle.properties has no forge_version"; exit 1; }
          elif [[ -e forge ]]; then
            echo "::error::the tree carries half a Forge module (forge/build.gradle and forge/src must both exist)"; exit 1
          elif [[ -n "$FG" ]]; then
            echo "::error::gradle.properties has a forge_version, but the tree has no forge/ module"; exit 1
          fi
          echo "Loaders of Minecraft $MC: Fabric, NeoForge$([[ "$FORGE" != true ]] || echo ', Forge')"
          echo "forge=$FORGE" >> "$GITHUB_OUTPUT"
          TYPE=release
          [[ "$FG" != *-beta* ]] || TYPE=beta
          echo "forge_type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Same Gradle User Home cache as test.yml, but READ-ONLY, for two reasons. A tag ref is not
      # the default branch, so the action would default to read-only anyway; saying it out loud
      # keeps that from shifting under a future change of default. And `org.gradle.caching=true`
      # means the restored home carries build-cache-1, which a release must never write task
      # outputs back into for other runs to consume.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Release mode guard
        id: mode
        env:
          FORGE: ${{ steps.game.outputs.forge }}
          # Empty on a tag push (no inputs there); 'true' / 'false' on a dispatch.
          DISPATCH_FORGE: ${{ github.event.inputs.publish_forge }}
          # Repository variable, empty unless set: the only switch a tag push can see.
          REPO_FORGE: ${{ vars.PUBLISH_FORGE }}
        run: |
          for value in "$DISPATCH_FORGE" "$REPO_FORGE"; do
            case "$value" in ''|true|false) ;; *) echo "::error::publish_forge / PUBLISH_FORGE must be true or false (got '$value')"; exit 1 ;; esac
          done
          # Off wins: a recovery dispatch with the default input must not undo a variable set to false.
          FORGE_SWITCH=true
          [ "$DISPATCH_FORGE" != false ] && [ "$REPO_FORGE" != false ] || FORGE_SWITCH=false
          case "${PUBLISH_LOADERS}" in
            all)
              PUBLISH_FORGE=false
              [ "$FORGE" != true ] || PUBLISH_FORGE="$FORGE_SWITCH"
              echo "publish_fabric=true" >> "$GITHUB_OUTPUT"
              echo "publish_neoforge=true" >> "$GITHUB_OUTPUT"
              echo "publish_forge=$PUBLISH_FORGE" >> "$GITHUB_OUTPUT"
              echo "Release mode: every loader of the line (Forge on this line: $FORGE, published here: $PUBLISH_FORGE)"
              if [ "$FORGE" = true ] && [ "$PUBLISH_FORGE" = false ]; then
                echo "::notice::Forge is switched off for this run: upload the Forge jar of the GitHub Release to Modrinth and CurseForge by hand"
              fi
              ;;
            *)
              echo "::error::PUBLISH_LOADERS must be 'all' for the standard release workflow (got '${PUBLISH_LOADERS}')"
              exit 1
              ;;
          esac

      # Hard gate: never publish a tree that carries Cyrillic, secrets or denylisted
      # paths — even if the guard workflow is skipped.
      - name: Cleanliness gate
        run: bash .github/scripts/scan-clean.sh .

      # One root build compiles all modules (common + fabric + neoforge, + forge where settings.gradle
      # includes it) and runs the Fabric server gametests as part of :fabric:build.
      #
      # ALA_BUILD_TIME stamps the real publish time into the released jar. A local build has no such
      # variable and falls back to the HEAD commit date on purpose: the stamp has to be a function of
      # the build's INPUTS, or processResources stops being up-to-date the moment the clock ticks over
      # a minute — which used to invalidate jar, remapJar and every gametest with it. A release build
      # is a clean one-shot, so re-stamping it costs nothing.
      #
      # --no-build-cache: the restored Gradle home carries build-cache-1, and a task result served
      # from it is a test that did NOT run against the tree being shipped. This has bitten before —
      # `:neoforge:test` came back FROM-CACHE in one second and the gate stayed green without
      # executing anything. The cache still pays for itself here through dependencies and the asset
      # root, which this flag does not touch.
      # MOD-678: the same commit was already built and game-tested by the manual Tests run that gates
      # the tag (release-pair.sh). When that run is green and kept its jars, publish those jars instead
      # of building and testing the same tree again. The match is by commit: the run's head_sha must be
      # the tagged commit, and verify-artifacts below still checks each jar's version and loader. No
      # such run - the build and game tests below run as before.
      - name: Reuse the jars of the green pre-tag check
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORGE: ${{ steps.game.outputs.forge }}
        run: |
          SHA="$(git rev-parse HEAD)"
          RUN="$(gh run list -R "$REPO" --workflow test.yml --event workflow_dispatch --status success \
                 --limit 20 --json databaseId,headSha --jq "[.[] | select(.headSha == \"$SHA\")][0].databaseId // empty")"
          if [ -z "$RUN" ]; then
            echo "no green manual Tests run on $SHA - building here"
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/verified
          if ! gh run download "$RUN" -R "$REPO" -n release-jars -D /tmp/verified; then
            echo "::warning::Tests run $RUN on $SHA kept no jars - building here"
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A run made before this line shipped Forge kept no Forge jar: build here rather than publish
          # an incomplete set.
          if [ "$FORGE" = true ] && [ -z "$(find /tmp/verified -name 'alaindustrial-forge-*.jar')" ]; then
            echo "::warning::Tests run $RUN on $SHA kept no Forge jar - building here"
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p fabric/build/libs neoforge/build/libs
          find /tmp/verified -name 'alaindustrial-fabric-*.jar'   -exec cp {} fabric/build/libs/ \;
          find /tmp/verified -name 'alaindustrial-neoforge-*.jar' -exec cp {} neoforge/build/libs/ \;
          if [ "$FORGE" = true ]; then
            mkdir -p forge/build/libs
            find /tmp/verified -name 'alaindustrial-forge-*.jar' -exec cp {} forge/build/libs/ \;
          fi
          echo "reusing the jars of Tests run $RUN (commit $SHA)"
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.reuse.outputs.reused != 'true'
        run: |
          export ALA_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M)"
          ./gradlew build --no-daemon --stacktrace --no-build-cache

      # In-world behaviour tests for EVERY loader of the line must pass before a release ships.
      # :fabric:runGameTest = Fabric server gametests; :neoforge:runGameTests = NeoForge
      # gameTestServer world tests; :forge:runGameTests = Forge's game-test server (a tree with forge/).
      # Required tests gate the build; tests marked optional (unfinished features) only warn.
      - name: Game tests (every loader)
        if: steps.reuse.outputs.reused != 'true'
        env:
          FORGE: ${{ steps.game.outputs.forge }}
        run: |
          LANES=(:fabric:runGameTest :neoforge:runGameTests)
          [ "$FORGE" != true ] || LANES+=(:forge:runGameTests)
          ./gradlew "${LANES[@]}" --no-daemon --stacktrace --no-build-cache

      # Resolve EVERY production jar of the line and validate them before any upload. Guards:
      #  1. each jar exists and is non-empty,
      #  2. the version in each filename matches the tag (catches a stale jar),
      #  3. each jar actually carries its loader's metadata — so the [Fabric] /
      #     [NeoForge] / [Forge] label can never be pinned to the wrong artifact,
      #  4. the set of jars is the tree's own: a Forge jar exactly when the tree carries forge/.
      - name: Resolve & validate artifacts
        id: meta
        env:
          # Through env, never `VERSION="${{ … }}"` straight into the script: an expression
          # interpolated into a run block is substituted before bash sees it, so the value
          # would be executed as source. Same reason the tag is read from env one step above.
          RELEASE_VERSION: ${{ steps.rel.outputs.version }}
          MC: ${{ steps.game.outputs.minecraft }}
          FORGE: ${{ steps.game.outputs.forge }}
        run: |
          VERSION="$RELEASE_VERSION"
          FABRIC_JAR="fabric/build/libs/alaindustrial-fabric-$MC-$VERSION.jar"
          NEOFORGE_JAR="neoforge/build/libs/alaindustrial-neoforge-$MC-$VERSION.jar"
          FORGE_JAR=""
          [ "$FORGE" != true ] || FORGE_JAR="forge/build/libs/alaindustrial-forge-$MC-$VERSION.jar"
          for f in "$FABRIC_JAR" "$NEOFORGE_JAR" $FORGE_JAR; do
            [ -s "$f" ] || { echo "::error::missing or empty jar: $f"; exit 1; }
            case "$f" in *"-$VERSION.jar") ;; *) echo "::error::jar version != $VERSION ($f)"; exit 1;; esac
          done
          FORGE_ARGS=()
          [ -z "$FORGE_JAR" ] || FORGE_ARGS=(--forge "$FORGE_JAR")
          python .github/scripts/verify-artifacts.py \
            --version "$VERSION" --minecraft "$MC" --tree . \
            --fabric "$FABRIC_JAR" \
            --neoforge "$NEOFORGE_JAR" \
            "${FORGE_ARGS[@]}" \
            --output release-manifest.json
          # SHA-512 next to the SHA-256: Modrinth reports sha1 and sha512 for every file, so this
          # is the hash a post-release check can compare a Modrinth file against.
          jq --arg fabric "$(sha512sum "$FABRIC_JAR" | cut -d' ' -f1)" \
             --arg neoforge "$(sha512sum "$NEOFORGE_JAR" | cut -d' ' -f1)" \
             --arg forge "$([ -z "$FORGE_JAR" ] || sha512sum "$FORGE_JAR" | cut -d' ' -f1)" \
             '.artifacts |= map(.sha512 = ({fabric: $fabric, neoforge: $neoforge, forge: $forge}[.loader]))' \
             release-manifest.json > release-manifest.tmp
          mv release-manifest.tmp release-manifest.json
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "fabric_jar=$FABRIC_JAR"     >> "$GITHUB_OUTPUT"
          echo "neoforge_jar=$NEOFORGE_JAR" >> "$GITHUB_OUTPUT"
          echo "forge_jar=$FORGE_JAR"       >> "$GITHUB_OUTPUT"
          # The GitHub Release attachments, one path per line.
          {
            echo "files<<FILES_END"
            printf '%s\n' "$FABRIC_JAR" "$NEOFORGE_JAR" $FORGE_JAR release-manifest.json publish-ids.json
            echo "FILES_END"
          } >> "$GITHUB_OUTPUT"
          echo "Fabric:   $FABRIC_JAR"
          echo "NeoForge: $NEOFORGE_JAR"
          echo "Forge:    ${FORGE_JAR:-none, the tree has no forge/}"

      # Exclude the obsolete legacy version group; ambiguous matches fail before uploads.
      - name: Resolve CurseForge loader IDs
        id: loaders
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MC: ${{ steps.game.outputs.minecraft }}
          # Only when this run uploads Forge: with Forge switched off for a hand upload, a CurseForge list
          # without a single "Forge" entry must not stop the Fabric and NeoForge uploads.
          FORGE: ${{ steps.mode.outputs.publish_forge }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::CURSEFORGE_TOKEN missing"; exit 1; }
          curl -sSf --retry 5 --retry-delay 15 --connect-timeout 20 --max-time 180 \
            -H "X-Api-Token: $CF_TOKEN" "https://minecraft.curseforge.com/api/game/versions" -o cf_versions.json
          MC_ID=$(jq -er --arg mc "$MC" '[.[] | select(.name == $mc and .gameVersionTypeID != 1)] | if length == 1 then .[0].id else error("ambiguous Minecraft version") end' cf_versions.json)
          NEOFORGE_ID=$(jq -er '[.[] | select(.name == "NeoForge")] | if length == 1 then .[0].id else error("ambiguous loader") end' cf_versions.json)
          [[ "$MC_ID" =~ ^[0-9]+$ && "$NEOFORGE_ID" =~ ^[0-9]+$ ]] || exit 1
          echo "minecraft_id=$MC_ID" >> "$GITHUB_OUTPUT"
          echo "neoforge_id=$NEOFORGE_ID" >> "$GITHUB_OUTPUT"
          # The Forge loader entry, matched by its exact name ("NeoForge" is a different entry).
          if [ "$FORGE" = true ]; then
            FORGE_ID=$(jq -er '[.[] | select(.name == "Forge")] | if length == 1 then .[0].id else error("ambiguous loader") end' cf_versions.json)
            [[ "$FORGE_ID" =~ ^[0-9]+$ ]] || exit 1
            echo "forge_id=$FORGE_ID" >> "$GITHUB_OUTPUT"
          fi

      # Modrinth project ACLWFBlU (slug: ala-industrial). We publish separate
      # versions per loader because Modrinth dependencies are version-level, not
      # file-level: Fabric requires Fabric API, NeoForge and Forge do not.
      - name: Check Modrinth upload targets
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_VERSION: ${{ steps.game.outputs.identity }}
        run: |
          [ -n "$MODRINTH_TOKEN" ] || { echo "::error::MODRINTH_TOKEN secret is missing or empty"; exit 1; }
          VERSION="$RELEASE_VERSION"
          versions=$(curl -sSf --retry 5 --retry-delay 15 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://api.modrinth.com/v2/project/ACLWFBlU/version" \
            -H "User-Agent: AlaVatra/AlaIndustrial-release/1.0")
          fabric_exists=$(printf '%s' "$versions" | jq -r --arg v "$VERSION+fabric" 'any(.[]; .version_number == $v)')
          neoforge_exists=$(printf '%s' "$versions" | jq -r --arg v "$VERSION+neoforge" 'any(.[]; .version_number == $v)')
          forge_exists=$(printf '%s' "$versions" | jq -r --arg v "$VERSION+forge" 'any(.[]; .version_number == $v)')
          echo "fabric_exists=$fabric_exists" >> "$GITHUB_OUTPUT"
          echo "neoforge_exists=$neoforge_exists" >> "$GITHUB_OUTPUT"
          echo "forge_exists=$forge_exists" >> "$GITHUB_OUTPUT"
          echo "Modrinth Fabric target $VERSION+fabric exists: $fabric_exists"
          echo "Modrinth NeoForge target $VERSION+neoforge exists: $neoforge_exists"
          echo "Modrinth Forge target $VERSION+forge exists: $forge_exists"

      - name: Publish Fabric to Modrinth
        id: mr_fabric
        if: steps.mode.outputs.publish_fabric == 'true' && steps.modrinth.outputs.fabric_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.game.outputs.identity }}
          MC: ${{ steps.game.outputs.minecraft }}
          JAR: ${{ steps.meta.outputs.fabric_jar }}
        run: |
          data=$(jq -n \
            --rawfile changelog CHANGELOG.md \
            --arg project "ACLWFBlU" \
            --arg mc "$MC" \
            --arg version "$VERSION+fabric" \
            --arg name "Ala Industrial $VERSION [Fabric]" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [{project_id: "P7dR8mSH", dependency_type: "required"}],
              game_versions: [$mc],
              version_type: "release",
              loaders: ["fabric"],
              featured: false,
              status: "listed",
              project_id: $project,
              file_parts: ["fabric_file"],
              primary_file: "fabric_file",
              environment: "client_and_server"
            }')
          # Retry up to 5x, surfacing the Modrinth error body on failure. curl runs without -f
          # (which would hide the response body on an HTTP error); the status is checked below.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o modrinth_resp.json -w '%{http_code}' -X POST \
              "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: AlaVatra/AlaIndustrial-release/1.0" \
              --form-string "data=$data" \
              -F "fabric_file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "Modrinth Fabric upload OK (HTTP $code)"
              cat modrinth_resp.json
              echo "id=$(jq -r '.id // empty' modrinth_resp.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Modrinth Fabric upload attempt $attempt failed with HTTP $code; body:"
            cat modrinth_resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          echo "::error::Modrinth Fabric upload failed after 5 attempts (last HTTP $code). Response body above."
          exit 1

      - name: Publish NeoForge to Modrinth
        id: mr_neoforge
        if: steps.mode.outputs.publish_neoforge == 'true' && steps.modrinth.outputs.neoforge_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.game.outputs.identity }}
          MC: ${{ steps.game.outputs.minecraft }}
          RELEASE_TYPE: ${{ steps.game.outputs.neoforge_type }}
          JAR: ${{ steps.meta.outputs.neoforge_jar }}
        run: |
          data=$(jq -n \
            --rawfile changelog CHANGELOG.md \
            --arg project "ACLWFBlU" \
            --arg mc "$MC" \
            --arg release_type "$RELEASE_TYPE" \
            --arg version "$VERSION+neoforge" \
            --arg name "Ala Industrial $VERSION [NeoForge]" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: [$mc],
              version_type: $release_type,
              loaders: ["neoforge"],
              featured: false,
              status: "listed",
              project_id: $project,
              file_parts: ["neoforge_file"],
              primary_file: "neoforge_file",
              environment: "client_and_server"
            }')
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o modrinth_resp.json -w '%{http_code}' -X POST \
              "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: AlaVatra/AlaIndustrial-release/1.0" \
              --form-string "data=$data" \
              -F "neoforge_file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "Modrinth NeoForge upload OK (HTTP $code)"
              cat modrinth_resp.json
              echo "id=$(jq -r '.id // empty' modrinth_resp.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Modrinth NeoForge upload attempt $attempt failed with HTTP $code; body:"
            cat modrinth_resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          echo "::error::Modrinth NeoForge upload failed after 5 attempts (last HTTP $code). Response body above."
          exit 1

      # Forge: any line whose tree carries forge/. No required dependency: the jar needs only Forge and Minecraft
      # (forge/src/main/resources/META-INF/mods.toml).
      - name: Publish Forge to Modrinth
        id: mr_forge
        if: steps.mode.outputs.publish_forge == 'true' && steps.modrinth.outputs.forge_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.game.outputs.identity }}
          MC: ${{ steps.game.outputs.minecraft }}
          RELEASE_TYPE: ${{ steps.game.outputs.forge_type }}
          JAR: ${{ steps.meta.outputs.forge_jar }}
        run: |
          data=$(jq -n \
            --rawfile changelog CHANGELOG.md \
            --arg project "ACLWFBlU" \
            --arg mc "$MC" \
            --arg release_type "$RELEASE_TYPE" \
            --arg version "$VERSION+forge" \
            --arg name "Ala Industrial $VERSION [Forge]" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: [$mc],
              version_type: $release_type,
              loaders: ["forge"],
              featured: false,
              status: "listed",
              project_id: $project,
              file_parts: ["forge_file"],
              primary_file: "forge_file",
              environment: "client_and_server"
            }')
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o modrinth_resp.json -w '%{http_code}' -X POST \
              "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: AlaVatra/AlaIndustrial-release/1.0" \
              --form-string "data=$data" \
              -F "forge_file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "Modrinth Forge upload OK (HTTP $code)"
              cat modrinth_resp.json
              echo "id=$(jq -r '.id // empty' modrinth_resp.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Modrinth Forge upload attempt $attempt failed with HTTP $code; body:"
            cat modrinth_resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          echo "::error::Modrinth Forge upload failed after 5 attempts (last HTTP $code). Response body above."
          exit 1

      # Best-effort public index check before hitting the CurseForge upload API.
      # If cfwidget is unavailable we fail closed: a re-run could otherwise create
      # duplicate files because the upload API has no documented "list files" route.
      - name: Check CurseForge upload targets
        id: curseforge
        env:
          RELEASE_VERSION: ${{ steps.game.outputs.identity }}
        run: |
          VERSION="$RELEASE_VERSION"
          # The index goes to a FILE, never into argv or an env var. It carries every file the
          # project ever published, so it grows with each release: at 171 files it reached 131 KiB
          # and crossed the kernel's 128 KiB limit for a single argument, killing the step with
          # "Argument list too long" (exit 126) before either upload could run — that is what
          # stranded v0.1.84 with Modrinth published and CurseForge empty. A file has no such limit,
          # so this scales no matter how many releases accumulate.
          curl -sSf --retry 5 --retry-delay 15 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://api.cfwidget.com/minecraft/mc-mods/1597723" \
            -H "User-Agent: AlaVatra/AlaIndustrial-release/1.0" \
            -o cfwidget.json
          python - "$VERSION" <<'PY' > cf_targets.env
          import json, sys
          version = sys.argv[1]
          with open("cfwidget.json", encoding="utf-8") as fh:
              data = json.load(fh)
          names = []
          for f in data.get("files", []):
              names.append(str(f.get("display", "")))
              names.append(str(f.get("name", "")))
          def has(loader):
              return f"Ala Industrial v{version} [{loader}]" in names
          print(f"fabric_exists={str(has('Fabric')).lower()}")
          print(f"neoforge_exists={str(has('NeoForge')).lower()}")
          print(f"forge_exists={str(has('Forge')).lower()}")
          PY
          cat cf_targets.env >> "$GITHUB_OUTPUT"
          # Read the echo values back from OUR file, not from $GITHUB_OUTPUT: the Modrinth step
          # writes keys of the same name earlier in the job, so grepping the shared file printed
          # Modrinth's answer while CurseForge's own value sat further down.
          echo "CurseForge Fabric target $VERSION exists: $(grep '^fabric_exists=' cf_targets.env | cut -d= -f2)"
          echo "CurseForge NeoForge target $VERSION exists: $(grep '^neoforge_exists=' cf_targets.env | cut -d= -f2)"
          echo "CurseForge Forge target $VERSION exists: $(grep '^forge_exists=' cf_targets.env | cut -d= -f2)"

      # One CurseForge upload per loader, as SEPARATE steps so a partial
      # failure (one loader up, another down) is unambiguous in the job log and
      # you re-run only what failed. Same changelog for every loader.
      - name: Publish Fabric to CurseForge
        id: cf_fabric
        if: steps.mode.outputs.publish_fabric == 'true' && steps.curseforge.outputs.fabric_exists != 'true'
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          JAR: ${{ steps.meta.outputs.fabric_jar }}
          MC_ID: ${{ steps.loaders.outputs.minecraft_id }}
          DISPLAY_NAME: Ala Industrial ${{ steps.rel.outputs.tag }} [Fabric]
        run: |
          metadata=$(jq -n \
            --rawfile changelog CHANGELOG.md \
            --arg name "$DISPLAY_NAME" \
            --argjson mc "$MC_ID" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, gameVersions: [$mc, 7499, 9638, 9639], releaseType: "release"}')
          # $mc = this line's Minecraft version (resolved in "Resolve CurseForge loader IDs"),
          # 7499 = Fabric, 9638 = Client, 9639 = Server.
          # Client/Server env tags are required since CurseForge started enforcing the
          # "environment group" (errorCode 1021) around 2026-07; prior releases uploaded
          # without them. Retry up to 5x; curl runs without -f (which would hide the response
          # body on an HTTP error), so the status is checked explicitly and the body is shown.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o cf_resp.json -w '%{http_code}' -X POST \
              "https://minecraft.curseforge.com/api/projects/1597723/upload-file" \
              -H "X-Api-Token: $CF_TOKEN" \
              --form-string "metadata=$metadata" \
              -F "file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "CurseForge Fabric upload OK (HTTP $code)"
              cat cf_resp.json
              echo "file_id=$(jq -r '.id // empty' cf_resp.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::CurseForge Fabric upload attempt $attempt failed with HTTP $code; body:"
            cat cf_resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          echo "::error::CurseForge Fabric upload failed after 5 attempts (last HTTP $code). Response body above."
          exit 1

      - name: Publish NeoForge to CurseForge
        id: cf_neoforge
        if: steps.mode.outputs.publish_neoforge == 'true' && steps.curseforge.outputs.neoforge_exists != 'true'
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          JAR: ${{ steps.meta.outputs.neoforge_jar }}
          NEOFORGE_ID: ${{ steps.loaders.outputs.neoforge_id }}
          RELEASE_TYPE: ${{ steps.game.outputs.neoforge_type }}
          MC_ID: ${{ steps.loaders.outputs.minecraft_id }}
          DISPLAY_NAME: Ala Industrial ${{ steps.rel.outputs.tag }} [NeoForge]
        run: |
          metadata=$(jq -n \
            --rawfile changelog CHANGELOG.md \
            --arg name "$DISPLAY_NAME" \
            --argjson mc "$MC_ID" \
            --arg release_type "$RELEASE_TYPE" \
            --argjson nf "$NEOFORGE_ID" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, gameVersions: [$mc, $nf, 9638, 9639], releaseType: $release_type}')
          # $mc = this line's Minecraft version and $nf = NeoForge (both resolved above),
          # 9638 = Client, 9639 = Server (required by CurseForge's "environment group"
          # enforcement, see the Fabric step).
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o cf_resp.json -w '%{http_code}' -X POST \
              "https://minecraft.curseforge.com/api/projects/1597723/upload-file" \
              -H "X-Api-Token: $CF_TOKEN" \
              --form-string "metadata=$metadata" \
              -F "file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "CurseForge NeoForge upload OK (HTTP $code)"
              cat cf_resp.json
              echo "file_id=$(jq -r '.id // empty' cf_resp.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::CurseForge NeoForge upload attempt $attempt failed with HTTP $code; body:"
            cat cf_resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          echo "::error::CurseForge NeoForge upload failed after 5 attempts (last HTTP $code). Response body above."
          exit 1

      - name: Publish Forge to CurseForge
        id: cf_forge
        if: steps.mode.outputs.publish_forge == 'true' && steps.curseforge.outputs.forge_exists != 'true'
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          JAR: ${{ steps.meta.outputs.forge_jar }}
          FORGE_ID: ${{ steps.loaders.outputs.forge_id }}
          RELEASE_TYPE: ${{ steps.game.outputs.forge_type }}
          MC_ID: ${{ steps.loaders.outputs.minecraft_id }}
          DISPLAY_NAME: Ala Industrial ${{ steps.rel.outputs.tag }} [Forge]
        run: |
          metadata=$(jq -n \
            --rawfile changelog CHANGELOG.md \
            --arg name "$DISPLAY_NAME" \
            --argjson mc "$MC_ID" \
            --arg release_type "$RELEASE_TYPE" \
            --argjson fg "$FORGE_ID" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, gameVersions: [$mc, $fg, 9638, 9639], releaseType: $release_type}')
          # $mc = this line's Minecraft version and $fg = Forge (both resolved above),
          # 9638 = Client, 9639 = Server (the "environment group", see the Fabric step).
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o cf_resp.json -w '%{http_code}' -X POST \
              "https://minecraft.curseforge.com/api/projects/1597723/upload-file" \
              -H "X-Api-Token: $CF_TOKEN" \
              --form-string "metadata=$metadata" \
              -F "file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "CurseForge Forge upload OK (HTTP $code)"
              cat cf_resp.json
              echo "file_id=$(jq -r '.id // empty' cf_resp.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::CurseForge Forge upload attempt $attempt failed with HTTP $code; body:"
            cat cf_resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          echo "::error::CurseForge Forge upload failed after 5 attempts (last HTTP $code). Response body above."
          exit 1

      # A machine-readable record of what this run published, attached to the GitHub Release so
      # a post-release check can ask each marketplace about exactly these files instead of
      # scanning listings. Only public identifiers and hashes; nothing from a response body.
      # A target skipped because it already existed is still named: Modrinth by looking its
      # version up by version_number, CurseForge as "preexisting" (its upload token cannot list
      # files). Never fails the release over bookkeeping: a missing id is written as null and
      # the check falls back to the listing for that loader. A tree without forge/ records no forge keys.
      - name: Record publication ids
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          VERSION: ${{ steps.game.outputs.identity }}
          MR_FABRIC_ID: ${{ steps.mr_fabric.outputs.id }}
          MR_NEOFORGE_ID: ${{ steps.mr_neoforge.outputs.id }}
          CF_FABRIC_ID: ${{ steps.cf_fabric.outputs.file_id }}
          CF_NEOFORGE_ID: ${{ steps.cf_neoforge.outputs.file_id }}
          MR_FORGE_ID: ${{ steps.mr_forge.outputs.id }}
          CF_FORGE_ID: ${{ steps.cf_forge.outputs.file_id }}
          PUBLISH_FORGE: ${{ steps.mode.outputs.publish_forge }}
          FABRIC_JAR: ${{ steps.meta.outputs.fabric_jar }}
          NEOFORGE_JAR: ${{ steps.meta.outputs.neoforge_jar }}
          FORGE_JAR: ${{ steps.meta.outputs.forge_jar }}
        run: |
          modrinth_id() {  # $1 = id from the upload step (empty when skipped), $2 = version_number
            if [[ "$1" =~ ^[A-Za-z0-9]{8}$ ]]; then printf '%s' "$1"; return; fi
            curl -sSf --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 20 --max-time 60 \
              "https://api.modrinth.com/v2/project/ACLWFBlU/version" \
              -H "User-Agent: AlaVatra/AlaIndustrial-release/1.0" \
              | jq -r --arg v "$2" '[.[] | select(.version_number == $v) | .id][0] // empty' \
              || true
          }
          cf_entry() {  # $1 = file id from the upload step; empty = the step was skipped
            if [[ "$1" =~ ^[0-9]+$ ]]; then jq -n --argjson id "$1" '{fileId: $id}'
            else jq -n '{fileId: null, preexisting: true}'; fi
          }
          MF="$(modrinth_id "$MR_FABRIC_ID" "$VERSION+fabric")"
          MN="$(modrinth_id "$MR_NEOFORGE_ID" "$VERSION+neoforge")"
          [[ -n "$MF" && -n "$MN" ]] || echo "::warning::a Modrinth version id could not be resolved; recorded as null"
          jq -n \
            --arg tag "$TAG" \
            --arg mf "$MF" --arg mfv "$VERSION+fabric" \
            --arg mn "$MN" --arg mnv "$VERSION+neoforge" \
            --argjson cff "$(cf_entry "$CF_FABRIC_ID")" \
            --argjson cfn "$(cf_entry "$CF_NEOFORGE_ID")" \
            --arg sf "$(sha256sum "$FABRIC_JAR" | cut -d' ' -f1)" \
            --arg sn "$(sha256sum "$NEOFORGE_JAR" | cut -d' ' -f1)" \
            '{
              tag: $tag,
              modrinth: {
                fabric:   {id: (if $mf == "" then null else $mf end), version_number: $mfv},
                neoforge: {id: (if $mn == "" then null else $mn end), version_number: $mnv}
              },
              curseforge: {fabric: $cff, neoforge: $cfn},
              sha256: {fabric: $sf, neoforge: $sn}
            }' > publish-ids.json
          if [ -n "$FORGE_JAR" ]; then
            MG="$(modrinth_id "$MR_FORGE_ID" "$VERSION+forge")"
            # Forge switched off for this run: its files are uploaded by hand, so nothing here is evidence
            # that they exist. by_hand tells the post-release check to look for the hand-uploaded files.
            BY_HAND=false
            CFG="$(cf_entry "$CF_FORGE_ID")"
            if [ "$PUBLISH_FORGE" != true ]; then
              BY_HAND=true
              CFG="$(jq -n '{fileId: null, by_hand: true}')"
            elif [[ -z "$MG" ]]; then
              echo "::warning::the Modrinth Forge version id could not be resolved; recorded as null"
            fi
            jq --arg mg "$MG" --arg mgv "$VERSION+forge" \
               --argjson cfg "$CFG" --argjson by_hand "$BY_HAND" \
               --arg sg "$(sha256sum "$FORGE_JAR" | cut -d' ' -f1)" \
               '.modrinth.forge = ({id: (if $mg == "" then null else $mg end), version_number: $mgv}
                                   + (if $by_hand then {by_hand: true} else {} end))
                | .curseforge.forge = $cfg | .sha256.forge = $sg' \
               publish-ids.json > publish-ids.tmp
            mv publish-ids.tmp publish-ids.json
          fi
          cat publish-ids.json

      # One GitHub Release carrying every loader jar of the line. mc-publish renders Markdown
      # fine on GitHub.
      - name: Create GitHub Release
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          files: ${{ steps.meta.outputs.files }}
          name: Ala Industrial ${{ steps.rel.outputs.tag }}
          version: ${{ steps.rel.outputs.tag }}
          version-type: ${{ steps.game.outputs.neoforge_type }}
          changelog-file: CHANGELOG.md
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # No announcement here (MOD-647): a version ships as one tag per Minecraft line, and a post per tag
  # duplicated the news. The release skill posts once, after every line is verified, via announce.yml.
